basePath: /api
definitions:
  github_com_744223454_orderhub_internal_user.Role:
    enum:
    - admin
    - user
    - ops
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
    - RoleOps
  github_com_744223454_orderhub_internal_user.User:
    properties:
      created_at:
        description: CreatedAt 创建时间。
        type: string
      id:
        description: ID 主键，自增。
        type: integer
      name:
        description: Name 登录用户名，全局唯一。
        type: string
      role:
        allOf:
        - $ref: '#/definitions/github_com_744223454_orderhub_internal_user.Role'
        description: Role 用户角色。
      updated_at:
        description: UpdatedAt 最后更新时间。
        type: string
    type: object
  internal_order.Order:
    properties:
      amount:
        description: Amount 订单金额，单位为分（用整数避免浮点精度问题，前端展示时再除以 100）。
        type: integer
      created_at:
        description: CreatedAt 创建时间。
        type: string
      id:
        description: ID 主键，自增。
        type: integer
      product_name:
        description: ProductName 商品名称。
        type: string
      status:
        allOf:
        - $ref: '#/definitions/internal_order.Status'
        description: Status 订单状态。
      updated_at:
        description: UpdatedAt 最后更新时间。
        type: string
      user_id:
        description: UserID 下单用户 ID。
        type: integer
    type: object
  internal_order.Status:
    enum:
    - pending
    - paid
    - shipped
    - completed
    - refunded
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusPaid
    - StatusShipped
    - StatusCompleted
    - StatusRefunded
  internal_order.createOrderRequest:
    properties:
      amount:
        description: Amount 订单金额，单位为分。
        type: integer
      product_name:
        description: ProductName 商品名称。
        type: string
    required:
    - amount
    - product_name
    type: object
  internal_user.IdentityProvider:
    enum:
    - wecom
    type: string
    x-enum-varnames:
    - ProviderWecom
  internal_user.Role:
    enum:
    - admin
    - user
    - ops
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
    - RoleOps
  internal_user.User:
    properties:
      created_at:
        description: CreatedAt 创建时间。
        type: string
      id:
        description: ID 主键，自增。
        type: integer
      name:
        description: Name 登录用户名，全局唯一。
        type: string
      role:
        allOf:
        - $ref: '#/definitions/internal_user.Role'
        description: Role 用户角色。
      updated_at:
        description: UpdatedAt 最后更新时间。
        type: string
    type: object
  internal_user.adminUserView:
    properties:
      created_at:
        description: CreatedAt 创建时间。
        type: string
      has_password:
        description: HasPassword 账号是否设置了可用密码。企业微信扫码自动建出的账号没有密码。
        type: boolean
      id:
        description: ID 用户主键。
        type: integer
      identities:
        description: Identities 账号绑定的外部身份。
        items:
          $ref: '#/definitions/internal_user.identityView'
        type: array
      name:
        description: Name 用户名。
        type: string
      role:
        allOf:
        - $ref: '#/definitions/internal_user.Role'
        description: Role 用户角色。
      updated_at:
        description: UpdatedAt 最后更新时间。
        type: string
    type: object
  internal_user.identityView:
    properties:
      external_id:
        description: ExternalID 提供方侧的标识，如企业微信 userid。
        type: string
      id:
        description: ID 绑定关系主键。
        type: integer
      provider:
        allOf:
        - $ref: '#/definitions/internal_user.IdentityProvider'
        description: Provider 提供方，如 wecom。
    type: object
  internal_user.listUsersResponse:
    properties:
      items:
        description: Items 当前页的用户。
        items:
          $ref: '#/definitions/internal_user.adminUserView'
        type: array
      page:
        description: Page 生效后的页码，从 1 开始。
        type: integer
      page_size:
        description: PageSize 生效后的每页条数。
        type: integer
      total:
        description: Total 满足条件的用户总数（不受分页限制）。
        type: integer
    type: object
  internal_user.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_user.loginResponse:
    properties:
      token:
        description: Token Bearer 访问令牌，后续请求需放入 Authorization 头。
        type: string
      user:
        allOf:
        - $ref: '#/definitions/internal_user.User'
        description: User 登录成功的用户信息（不含密码哈希）。
    type: object
  internal_user.registerRequest:
    properties:
      password:
        type: string
      role:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_user.updateRoleRequest:
    properties:
      role:
        description: Role 目标角色，取值与 user.Role 一致。
        type: string
    required:
    - role
    type: object
  internal_wecom.Department:
    properties:
      id:
        description: ID 部门 id，同一企业内唯一。
        type: integer
      leader_user_ids:
        description: LeaderUserIDs 部门负责人的 userid 列表。
        items:
          type: string
        type: array
      name:
        description: Name 部门名称。
        type: string
      order:
        description: Order 在上级部门内的排序号，由企微分配（实测取值形如 99994000，不是 1/2/3）。
        type: integer
      parent_id:
        description: |-
          ParentID 上级部门 id，根部门为 0。

          ⚠️ 它可能指向一个**不在本列表里**的部门：自建应用只能读可见范围，
          父部门不在范围内时就成了孤儿。组装树的一方必须处理这种情况，别默认树是连通的。
        type: integer
    type: object
  internal_wecom.DirectorySnapshot:
    properties:
      departments:
        description: Departments 全量部门（已按 order、id 排序，顺序稳定）。
        items:
          $ref: '#/definitions/internal_wecom.Department'
        type: array
      fetched_at:
        description: FetchedAt 本次快照的抓取完成时间。
        type: string
      from_cache:
        description: |-
          FromCache 本次响应是否直接命中服务端缓存。
          前端据此说明「这份数据是刚抓的还是几分钟前的」，避免把缓存当成实时。
        type: boolean
      members:
        description: Members 去重后的成员（成员可属于多个部门，同一人只出现一次）。
        items:
          $ref: '#/definitions/internal_wecom.Member'
        type: array
    type: object
  internal_wecom.Member:
    properties:
      departments:
        description: Departments 所属部门（含是否负责人），至少一个。
        items:
          $ref: '#/definitions/internal_wecom.MemberDepartment'
        type: array
      direct_leader_ids:
        description: |-
          DirectLeaderIDs 直属上级的 userid 列表。

          ⚠️ 上级本人可能不在可见范围内，此时这个 userid 在 members 里查不到，
          前端要有回落（直接显示 userid 而不是空白）。
        items:
          type: string
        type: array
      main_department_id:
        description: MainDepartmentID 主部门 id。
        type: integer
      name:
        description: Name 成员姓名。
        type: string
      position:
        description: Position 职务，可能为空串。
        type: string
      status:
        description: Status 成员状态，取值见 MemberStatusXxx。
        type: integer
      userid:
        description: UserID 成员帐号，企业内唯一。
        type: string
    type: object
  internal_wecom.MemberDepartment:
    properties:
      id:
        description: ID 部门 id。
        type: integer
      is_leader:
        description: IsLeader 该成员是否为这个部门的负责人。
        type: boolean
    type: object
  internal_wecom.authorizeResponse:
    properties:
      url:
        description: URL 企业微信扫码登录页地址，前端应整页跳转到它（不是 fetch）。
        type: string
    type: object
  internal_wecom.callbackRequest:
    properties:
      code:
        description: Code 企微回调带回的授权码，只能用一次、5 分钟过期。
        type: string
      state:
        description: State 发起授权时下发的状态串，用于防 CSRF。
        type: string
    required:
    - code
    - state
    type: object
  internal_wecom.loginResponse:
    properties:
      token:
        description: Token Bearer 访问令牌，后续请求需放入 Authorization 头。
        type: string
      user:
        allOf:
        - $ref: '#/definitions/github_com_744223454_orderhub_internal_user.User'
        description: User 登录成功的用户信息（不含密码哈希）。
    type: object
host: localhost:8888
info:
  contact: {}
  description: 多角色订单系统后端接口：用户注册、登录与 JWT 认证，以及订单的下单、支付、发货、完成与退款。
  title: 多角色订单系统 API
  version: "1.0"
paths:
  /admin/orders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_order.Order'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 查询全部订单（仅运营/管理员）
      tags:
      - 订单管理
  /admin/orders/{id}/complete:
    post:
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_order.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 完成订单（shipped → completed，仅运营/管理员）
      tags:
      - 订单管理
  /admin/orders/{id}/refund:
    post:
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_order.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 退款（paid/shipped → refunded，仅运营/管理员）
      tags:
      - 订单管理
  /admin/orders/{id}/ship:
    post:
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_order.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 发货（paid → shipped，仅运营/管理员）
      tags:
      - 订单管理
  /admin/org/directory:
    get:
      parameters:
      - description: 传 1 则跳过服务端缓存重新抓取
        in: query
        name: refresh
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_wecom.DirectorySnapshot'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取企业通讯录
      tags:
      - 企业微信通讯录
  /admin/users:
    get:
      parameters:
      - description: 页码，从 1 开始（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页条数（默认 20，上限 100）
        in: query
        name: page_size
        type: integer
      - description: 用户名模糊匹配；纯数字时同时匹配用户 ID
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.listUsersResponse'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 查询用户列表（仅管理员）
      tags:
      - 用户管理
  /admin/users/{id}/identities/{provider}:
    delete:
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 身份提供方，如 wecom
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 解绑用户的外部身份（仅管理员）
      tags:
      - 用户管理
  /admin/users/{id}/role:
    patch:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 目标角色
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_user.updateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.adminUserView'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 修改用户角色（仅管理员）
      tags:
      - 用户管理
  /auth/wecom/authorize:
    get:
      parameters:
      - description: 授权用途：login（默认，扫码登录）或 bind（绑定到当前账号）
        in: query
        name: intent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_wecom.authorizeResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取企业微信扫码登录链接
      tags:
      - 企业微信登录
  /auth/wecom/bind:
    post:
      consumes:
      - application/json
      parameters:
      - description: 回调参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_wecom.callbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 绑定企业微信身份
      tags:
      - 企业微信登录
  /auth/wecom/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 回调参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_wecom.callbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_wecom.loginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 企业微信扫码登录
      tags:
      - 企业微信登录
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_user.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.loginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用户登录
      tags:
      - 用户
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取当前登录用户
      tags:
      - 用户
  /orders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_order.Order'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 查询自己的订单列表
      tags:
      - 订单
    post:
      consumes:
      - application/json
      parameters:
      - description: 下单信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_order.createOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_order.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建订单（登录用户）
      tags:
      - 订单
  /orders/{id}/pay:
    post:
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_order.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 支付自己的订单（pending → paid）
      tags:
      - 订单
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_user.registerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用户注册
      tags:
      - 用户
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

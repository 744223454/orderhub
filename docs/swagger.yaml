basePath: /api
definitions:
  user.Role:
    enum:
    - admin
    - user
    - ops
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
    - RoleOps
  user.User:
    properties:
      created_at:
        description: CreatedAt 创建时间。
        type: string
      id:
        description: ID 主键，自增。
        type: integer
      name:
        description: Name 登录用户名，全局唯一。
        type: string
      role:
        allOf:
        - $ref: '#/definitions/user.Role'
        description: Role 用户角色。
      updated_at:
        description: UpdatedAt 最后更新时间。
        type: string
    type: object
  user.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  user.loginResponse:
    properties:
      token:
        description: Token Bearer 访问令牌，后续请求需放入 Authorization 头。
        type: string
      user:
        allOf:
        - $ref: '#/definitions/user.User'
        description: User 登录成功的用户信息（不含密码哈希）。
    type: object
  user.registerRequest:
    properties:
      password:
        type: string
      role:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
host: localhost:8888
info:
  contact: {}
  description: 用户注册与登录接口
  title: 多角色订单系统 API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.loginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用户登录
      tags:
      - 用户
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取当前登录用户
      tags:
      - 用户
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.registerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用户注册
      tags:
      - 用户
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

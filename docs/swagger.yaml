basePath: /api
definitions:
  github_com_744223454_orderhub_internal_user.Role:
    enum:
    - admin
    - user
    - ops
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
    - RoleOps
  github_com_744223454_orderhub_internal_user.User:
    properties:
      created_at:
        description: CreatedAt 创建时间。
        type: string
      id:
        description: ID 主键，自增。
        type: integer
      name:
        description: Name 登录用户名，全局唯一。
        type: string
      role:
        allOf:
        - $ref: '#/definitions/github_com_744223454_orderhub_internal_user.Role'
        description: Role 用户角色。
      updated_at:
        description: UpdatedAt 最后更新时间。
        type: string
    type: object
  internal_order.Order:
    properties:
      amount:
        description: Amount 订单金额，单位为分（用整数避免浮点精度问题，前端展示时再除以 100）。
        type: integer
      created_at:
        description: CreatedAt 创建时间。
        type: string
      id:
        description: ID 主键，自增。
        type: integer
      product_name:
        description: ProductName 商品名称。
        type: string
      status:
        allOf:
        - $ref: '#/definitions/internal_order.Status'
        description: Status 订单状态。
      updated_at:
        description: UpdatedAt 最后更新时间。
        type: string
      user_id:
        description: UserID 下单用户 ID。
        type: integer
    type: object
  internal_order.Status:
    enum:
    - pending
    - paid
    - shipped
    - completed
    - refunded
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusPaid
    - StatusShipped
    - StatusCompleted
    - StatusRefunded
  internal_order.createOrderRequest:
    properties:
      amount:
        description: Amount 订单金额，单位为分。
        type: integer
      product_name:
        description: ProductName 商品名称。
        type: string
    required:
    - amount
    - product_name
    type: object
  internal_user.Role:
    enum:
    - admin
    - user
    - ops
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
    - RoleOps
  internal_user.User:
    properties:
      created_at:
        description: CreatedAt 创建时间。
        type: string
      id:
        description: ID 主键，自增。
        type: integer
      name:
        description: Name 登录用户名，全局唯一。
        type: string
      role:
        allOf:
        - $ref: '#/definitions/internal_user.Role'
        description: Role 用户角色。
      updated_at:
        description: UpdatedAt 最后更新时间。
        type: string
    type: object
  internal_user.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_user.loginResponse:
    properties:
      token:
        description: Token Bearer 访问令牌，后续请求需放入 Authorization 头。
        type: string
      user:
        allOf:
        - $ref: '#/definitions/internal_user.User'
        description: User 登录成功的用户信息（不含密码哈希）。
    type: object
  internal_user.registerRequest:
    properties:
      password:
        type: string
      role:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_wecom.authorizeResponse:
    properties:
      url:
        description: URL 企业微信扫码登录页地址，前端应整页跳转到它（不是 fetch）。
        type: string
    type: object
  internal_wecom.callbackRequest:
    properties:
      code:
        description: Code 企微回调带回的授权码，只能用一次、5 分钟过期。
        type: string
      state:
        description: State 发起授权时下发的状态串，用于防 CSRF。
        type: string
    required:
    - code
    - state
    type: object
  internal_wecom.loginResponse:
    properties:
      token:
        description: Token Bearer 访问令牌，后续请求需放入 Authorization 头。
        type: string
      user:
        allOf:
        - $ref: '#/definitions/github_com_744223454_orderhub_internal_user.User'
        description: User 登录成功的用户信息（不含密码哈希）。
    type: object
host: localhost:8888
info:
  contact: {}
  description: 多角色订单系统后端接口：用户注册、登录与 JWT 认证，以及订单的下单、支付、发货、完成与退款。
  title: 多角色订单系统 API
  version: "1.0"
paths:
  /admin/orders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_order.Order'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 查询全部订单（仅运营/管理员）
      tags:
      - 订单管理
  /admin/orders/{id}/complete:
    post:
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_order.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 完成订单（shipped → completed，仅运营/管理员）
      tags:
      - 订单管理
  /admin/orders/{id}/refund:
    post:
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_order.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 退款（paid/shipped → refunded，仅运营/管理员）
      tags:
      - 订单管理
  /admin/orders/{id}/ship:
    post:
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_order.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 发货（paid → shipped，仅运营/管理员）
      tags:
      - 订单管理
  /auth/wecom/authorize:
    get:
      parameters:
      - description: 授权用途：login（默认，扫码登录）或 bind（绑定到当前账号）
        in: query
        name: intent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_wecom.authorizeResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取企业微信扫码登录链接
      tags:
      - 企业微信登录
  /auth/wecom/bind:
    post:
      consumes:
      - application/json
      parameters:
      - description: 回调参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_wecom.callbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 绑定企业微信身份
      tags:
      - 企业微信登录
  /auth/wecom/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 回调参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_wecom.callbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_wecom.loginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 企业微信扫码登录
      tags:
      - 企业微信登录
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_user.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.loginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用户登录
      tags:
      - 用户
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取当前登录用户
      tags:
      - 用户
  /orders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_order.Order'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 查询自己的订单列表
      tags:
      - 订单
    post:
      consumes:
      - application/json
      parameters:
      - description: 下单信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_order.createOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_order.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建订单（登录用户）
      tags:
      - 订单
  /orders/{id}/pay:
    post:
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_order.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 支付自己的订单（pending → paid）
      tags:
      - 订单
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_user.registerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用户注册
      tags:
      - 用户
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
